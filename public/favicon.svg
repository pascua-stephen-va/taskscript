<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003875" />
      <stop offset="50%" stop-color="#0052CC" />
      <stop offset="100%" stop-color="#00A3FF" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Outer Gradient Squircle matching TaskScript brand mark -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#brandGrad)" />

  <!-- Inner Dark Navy Background -->
  <rect x="5" y="5" width="54" height="54" rx="13" fill="#00142A" />

  <!-- Top-left subtle glass reflection -->
  <rect x="5" y="5" width="54" height="54" rx="13" fill="url(#innerGlow)" />

  <!-- TaskScript Brand Terminal Prompt & Underscore Mark -->
  <g transform="translate(8, 8) scale(2)">
    <polyline
      points="4 17 10 11 4 5"
      stroke="#00A3FF"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <line
      x1="12"
      y1="19"
      x2="20"
      y2="19"
      stroke="#00A3FF"
      stroke-width="3"
      stroke-linecap="round"
    />
  </g>
</svg>
