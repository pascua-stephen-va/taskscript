<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskScript | Department Prompt &amp; SOP Launcher</title>
    <meta name="description" content="Centralized interactive prompt assembler and standard operating procedure quick-launcher for virtual assistants, project managers, and operations teams." />
    <meta property="og:title" content="TaskScript | Department Prompt &amp; SOP Launcher" />
    <meta property="og:description" content="Centralized interactive prompt assembler and standard operating procedure quick-launcher for virtual assistants, project managers, and operations teams." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,500;1,9..40,600;1,9..40,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <script>
      // Suppress Vite HMR WebSocket connection errors (disabled in AI Studio preview environment)
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('@vite/client') !== -1 ||
          msg.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
          msg.indexOf('vite:ws') !== -1
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || (event.error && event.error.message))) || '';
        var src = (event && event.filename) || '';
        if (
          msg.indexOf('WebSocket') !== -1 ||
          src.indexOf('@vite/client') !== -1 ||
          msg.indexOf('createWebSocketModuleRunnerTransport') !== -1
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      });
      (function() {
        try {
          var saved = localStorage.getItem('taskscript_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || ((!saved || saved === 'auto' || saved === 'system') && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-amber-400 selection:text-slate-900 min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
